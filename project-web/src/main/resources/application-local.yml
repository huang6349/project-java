mybatis-flex:
  datasource:
    master:
      type: hikari
      driverClassName: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3206/project?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      username: root
      password: pwd123456
      minimumIdle: 10
      connectionTestQuery: SELECT 1
      maximumPoolSize: 20
      idleTimeout: 30000
      maxLifetime: 60000
      autoCommit: true
      poolName: PrimaryHikariCP
      connectionTimeout: 10000
    questdb:
      type: hikari
      driverClassName: org.postgresql.Driver
      url: jdbc:postgresql://${app.qdb.host}:3204/qdb?sslmode=disable
      username: ${app.qdb.username}
      password: ${app.qdb.password}
      minimumIdle: 10
      connectionTestQuery: SELECT 1
      maximumPoolSize: 20
      idleTimeout: 30000
      maxLifetime: 60000
      autoCommit: true
      poolName: QuestDBHikariCP
      connectionTimeout: 10000

spring.redis:
  database: 0
  host: 127.0.0.1
  port: 3279
  password: pwd123456
  timeout: 10s
  lettuce:
    pool:
      max-active: 200
      max-idle: 20
      max-wait: 10s
      min-idle: 10
    shutdown-timeout: 3s

dromara.x-file-storage:
  default-platform: minio
  minio:
    - platform: minio
      enable-storage: true
      access-key: minio
      secret-key: pwd123456
      end-point: http://127.0.0.1:3200
      bucket-name: project
      domain: http://127.0.0.1:3201/browser/project/
      base-path: local/

easy-es:
  address: 127.0.0.1:3202
  username: elastic
  password: pwd123456

app.qdb:
  host: 127.0.0.1
  port: 3205
  username: admin
  password: pwd123456
