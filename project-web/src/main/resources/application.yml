# ===================================================================
# Spring Boot 会自动扫描 classpath 下的 application.yml 文件，如果有就加载文件配置
#
# Spring Boot 中多环境配置文件名需要满足 application-{profile}.yml 的格式，{profile} 对应你的环境标识
# 本地环境 application-local.yml
# 开发环境 application-dev.yml
# 测试环境 application-test.yml
# 生产环境 application-prod.yml
# 多环境配置文件激活属性
# 本地环境 local
# 开发环境 dev
# 测试环境 test
# 生产环境 prod
# ===================================================================

# 应用名称配置
spring.application:
  name: project

# 多环境配置
spring.profiles:
  active: dev

# 文件上传相关配置项
spring.servlet.multipart:
  max-file-size: 1024MB # 单个文件大小
  max-request-size: 1024MB # 设置总上传的文件大小

# 请求相关配置项
spring.codec:
  max-in-memory-size: 128MB

# 监控端点配置
management:
  server:
    port: 8085

# 服务器配置
server:
  port: 8088

# 多数据源配置（MyBatis-Flex 内置）
# master 为默认数据源，AutoTable 自动建表与 Flyway 迁移仅作用于 master
mybatis-flex:
  default-datasource-key: master

# Flyway 配置
spring.flyway:
  enabled: false  # 禁用自动执行，由 FrameworkFlyway 手动控制

# 自动建表配置
auto-table:
  enable: true
  show-banner: false
  super-insert-position: after
  index-prefix: idx_
  mysql:
    column-default-collation: utf8mb4_general_ci
    column-default-charset: utf8mb4
    table-default-collation: utf8mb4_general_ci
    table-default-charset: utf8mb4
  record-sql:
    enable: true
    record-type: db
    version: 1.0.0
  init-data:
    enable: false

# 文档生成配置
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# 消息总线配置
eventbus:
  type: redis

# 验证码配置
aj.captcha:
  type: blockPuzzle
  water-mark: huangyalong
  slip-offset: 5
  interference-options: 2

# TypeSafe SDK 配置：经 OpenRouter 网关调用 Jev 模型
# base-url 只写到 /api，SDK 内部拼接 /v1/systemone，与官方 /api/alpha/decisions 契约一致（已实测）
# 模型钉死版本号，不用会漂移的 jev-latest；具体版本号不能带 ~ 别名
# api-key 留空时 starter 不装配 TypeSafeClient，调用 TypeSafeHelper.ask 会抛业务异常
typesafe:
  api-key: ${TYPESAFE_API_KEY:}
  base-url: https://openrouter.ai/api
  default-model: typesafe/jev-1.13
  timeout: 10s

# 其它配置
# ===================================================================

logging.level:
  org.flywaydb.core.internal.command.DbValidate: warn
  org.flywaydb.core.internal.command.DbBaseline: warn
  org.flywaydb.core.internal.command.DbMigrate: warn
  org.dromara.autotable.core.AutoTableBootstrap: warn
  org.dromara.autotable.core.utils.DBHelper: warn
  com.anji.captcha: warn
